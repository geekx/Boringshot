name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake build type (installer defaults to Release)"
        type: choice
        options: [Release, RelWithDebInfo, Debug]
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  core-linux:
    name: core tests (linux, ${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows ${{ inputs.build_type || 'Release' }} + installer
    runs-on: windows-2022
    permissions:
      contents: write   # release upload on tags
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Test (core + overlay smoke)
        run: ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure

      - name: Verify no dynamic CRT dependency
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /dependents "build\$env:BUILD_TYPE\boringshot.exe" | Out-String
          Write-Output $deps
          if ($deps -match '(?i)(vcruntime|msvcp)\d+') { throw "boringshot.exe links the dynamic MSVC runtime" }

      - name: Stage + portable zip
        shell: pwsh
        run: |
          cmake --install build --config $env:BUILD_TYPE --prefix dist
          cd build
          cpack -C $env:BUILD_TYPE -B ../out

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Boringshot VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\out" packaging\boringshot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Boringshot-win64-${{ env.BUILD_TYPE }}
          path: |
            out/*.exe
            out/*.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.zip
